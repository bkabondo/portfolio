    <!-- Inner iris -->
    <circle cx="50" cy="50" r="5" fill="#001f3f"/>
    <!-- Scan lines -->
    <line x1="20" y1="40" x2="30" y2="40" stroke="#001f3f" stroke-width="2"/>
    <line x1="70" y1="40" x2="80" y2="40" stroke="#001f3f" stroke-width="2"/>
    <line x1="20" y1="60" x2="30" y2="60" stroke="#001f3f" stroke-width="2"/>
    <line x1="70" y1="60" x2="80" y2="60" stroke="#001f3f" stroke-width="2"/>
  </g>
</svg>
