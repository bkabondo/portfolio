<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#00d4ff"/>
  <g fill="none" stroke="#001f3f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Eye outline -->
    <path d="M15 50 Q50 22 85 50 Q50 78 15 50Z"/>
